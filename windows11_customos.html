<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202020">
<title>Windows 11 — CustomOS</title>
<style>
:root{
  --accent:#60a5fa;--accent-rgb:96,165,250;--bg:#101114;--panel:rgba(32,32,32,.94);
  --panel-solid:#202020;--text:#f7f7f7;--muted:#b8b8b8;--line:rgba(255,255,255,.10);
  --taskbar-h:56px;--radius:8px;--font:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--text);background:#071426;user-select:none;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
button{color:inherit}
#boot-screen{position:fixed;inset:0;background:#050505;z-index:100000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:54px;transition:opacity .45s}
#boot-screen.hide{opacity:0;pointer-events:none}
.win-logo{width:76px;height:76px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px;transform:perspective(180px) rotateY(-8deg)}
.win-logo i{display:block;background:#f5f7fa}
.spinner{width:28px;height:28px;border:2px solid transparent;border-bottom-color:#eee;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#login-screen{display:none;position:fixed;inset:0;z-index:99999;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(135deg,#06162c,#07518b 48%,#081b38);background-size:cover;background-position:center}
#login-screen.visible{display:flex}
#login-screen:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(0,0,0,.15),rgba(0,0,0,.48))}
.login-content{position:relative;z-index:1;display:flex;align-items:center;flex-direction:column;text-shadow:0 2px 14px #0005}
.login-time{font-size:clamp(48px,8vw,82px);font-weight:300;letter-spacing:-2px}
.login-date{font-size:18px;margin:2px 0 34px}
.login-users{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.login-user{cursor:pointer;text-align:center;padding:14px 18px;border:1px solid transparent;border-radius:5px;min-width:125px}
.login-user:hover,.login-user:focus{background:#ffffff16;border-color:#ffffff40;outline:none}
.login-avatar,.user-avatar{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#686868;color:#fff;font-size:32px;font-weight:400;width:84px;height:84px;margin:0 auto 12px;overflow:hidden}
.login-avatar img{width:100%;height:100%;object-fit:cover}
.login-name{font-size:15px}
.login-password-box{display:none;flex-direction:column;align-items:center;gap:10px;margin-top:18px}
.login-password-box.show{display:flex}
.login-password-box input{width:260px;padding:10px 12px;background:#ffffff16;border:1px solid #ffffff70;color:white;outline:none}
.login-error{display:none;color:#ffb4b4;font-size:13px}
.win-btn{border:1px solid #ffffff35;background:#ffffff13;padding:8px 18px;cursor:pointer}
.win-btn:hover{background:#ffffff25}
.login-bottom{position:absolute;right:22px;bottom:22px;z-index:2}
.power-btn{width:42px;height:42px;border:0;background:#ffffff14;border-radius:4px;display:grid;place-items:center;cursor:pointer}
.power-btn:hover{background:#ffffff2a}
#desktop-wrap{display:none;position:fixed;inset:0}
#desktop-wrap.visible{display:block}
#desktop{position:absolute;inset:0 calc(0px) var(--taskbar-h);background:linear-gradient(125deg,#06162e 0%,#07559a 35%,#0c2e5b 55%,#071a37 100%);background-size:cover;background-position:center;overflow:hidden}
#desktop:before{content:"";position:absolute;width:min(75vw,1000px);height:min(75vw,1000px);right:-12%;top:4%;border-radius:50%;background:radial-gradient(ellipse at 28% 35%,#168bdb 0,#0757a0 30%,#072e61 56%,transparent 70%);filter:blur(3px);opacity:.9;pointer-events:none}
#desktop:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#06132b88 100%);pointer-events:none}
#desktop-icons{position:absolute;z-index:2;left:8px;top:8px;bottom:8px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:4px;width:min-content;max-width:100%;overflow:hidden}
.desk-icon{width:84px;min-height:82px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;padding:6px 4px;border:1px solid transparent;border-radius:3px;cursor:default;text-align:center}
.desk-icon:hover{background:#ffffff19;border-color:#ffffff20}
.desk-icon.selected{background:#ffffff2c;border-color:#ffffff4a}
.desk-icon .icon-wrap{width:34px;height:34px;display:grid;place-items:center;color:#fff;filter:drop-shadow(0 1px 2px #0008)}
.desk-icon svg{width:30px;height:30px}
.desk-icon span{font-size:12px;line-height:1.25;text-shadow:0 1px 3px #000}
#taskbar{position:absolute;z-index:9000;bottom:0;left:0;right:0;height:var(--taskbar-h);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;background:rgba(27,27,29,.82);backdrop-filter:blur(28px) saturate(1.4);border-top:1px solid #ffffff12}
#taskbar-apps{display:flex;align-items:center;gap:4px;min-width:0}
.taskbar-btn{width:44px;height:44px;border:1px solid transparent;border-radius:5px;background:transparent;display:grid;place-items:center;position:relative;cursor:pointer;flex-shrink:0}
.taskbar-btn:hover{background:#ffffff19}
.taskbar-btn:active{background:#ffffff2a}
.taskbar-btn svg{width:23px;height:23px}
.taskbar-btn.active:after{content:"";position:absolute;bottom:2px;width:16px;height:3px;border-radius:2px;background:#80c9ff}
#start-btn svg{width:25px;height:25px}
#search-taskbar{width:clamp(130px,17vw,220px);height:36px;display:flex;align-items:center;gap:8px;border:1px solid #ffffff18;background:#ffffffeb;color:#242424;border-radius:5px;padding:0 11px;cursor:text}
#search-taskbar svg{width:17px;height:17px}
#search-taskbar span{font-size:13px}
#system-tray{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;gap:2px}
.tray-item{height:40px;min-width:34px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 6px;border-radius:4px;font-size:12px;cursor:default}
.tray-item:hover{background:#ffffff16}
.tray-item svg{width:16px;height:16px}
#clock{min-width:74px;flex-direction:column;gap:1px;font-size:11px;line-height:1.2;text-align:center}
#start-menu{position:absolute;z-index:9500;bottom:calc(var(--taskbar-h) + 10px);left:50%;transform:translateX(-50%) translateY(12px);width:min(620px,calc(100vw - 20px));max-height:min(720px,calc(100vh - var(--taskbar-h) - 22px));display:none;flex-direction:column;overflow:hidden;background:rgba(32,32,32,.96);backdrop-filter:blur(34px);border:1px solid #ffffff20;border-radius:8px;box-shadow:0 18px 60px #0007;padding:28px 30px 0}
#start-menu.open{display:flex;animation:startIn .18s ease-out forwards}
@keyframes startIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
.start-search-wrap{height:38px;display:flex;align-items:center;gap:9px;background:#ffffff0b;border:1px solid #858585;border-bottom:2px solid var(--accent);border-radius:4px;padding:0 12px;margin-bottom:24px}
.start-search-wrap svg{width:17px;height:17px;color:#cfcfcf}
.start-search{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:13px}
.start-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:14px;font-weight:600}
.small-action{font-size:12px;padding:5px 10px;border:1px solid #ffffff20;background:#ffffff0c;border-radius:4px;cursor:pointer}
.start-apps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:24px}
.start-app{min-width:0;display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 3px;border-radius:4px;cursor:pointer}
.start-app:hover{background:#ffffff13}
.start-app .app-icon-wrap{width:36px;height:36px;display:grid;place-items:center}
.start-app svg{width:31px;height:31px}
.start-app span{font-size:11px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.recommended{border-top:1px solid #ffffff12;padding-top:20px;padding-bottom:20px}
.recommended-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.recommended-item{display:flex;align-items:center;gap:11px;padding:10px;border-radius:4px;cursor:pointer}
.recommended-item:hover{background:#ffffff13}
.recommended-item svg{width:27px;height:27px;flex-shrink:0}
.recommended-item b{font-size:12px;font-weight:500;display:block}
.recommended-item small{font-size:10px;color:#bcbcbc}
.start-footer{display:flex;align-items:center;gap:10px;margin:0 -30px;padding:12px 30px;background:#ffffff08;border-top:1px solid #ffffff0b}
.start-footer .user-avatar{width:30px;height:30px;font-size:14px;margin:0}
.start-footer span{flex:1;font-size:12px}
.start-footer button{border:0;background:transparent;border-radius:4px;width:36px;height:32px;display:grid;place-items:center;cursor:pointer}
.start-footer button:hover{background:#ffffff18}
.window{position:absolute;z-index:100;min-width:300px;min-height:190px;width:min(760px,calc(100vw - 24px));height:min(520px,calc(100vh - var(--taskbar-h) - 24px));display:flex;flex-direction:column;overflow:hidden;background:var(--panel);backdrop-filter:blur(28px) saturate(1.2);border:1px solid #ffffff26;border-radius:8px;box-shadow:0 14px 45px #0006;animation:windowIn .16s ease-out}
@keyframes windowIn{from{opacity:.4;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
.window.maximized{left:0!important;top:0!important;width:100%!important;height:calc(100% - var(--taskbar-h))!important;border-radius:0;resize:none}
.window.minimized{display:none}
.titlebar{height:38px;flex-shrink:0;display:flex;align-items:center;padding-left:12px;background:#202020b8;cursor:move}
.titlebar .title{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:12px;color:#eaeaea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar .title svg{width:16px;height:16px;flex-shrink:0}
.titlebar-btns{display:flex;align-self:stretch}
.tb-btn{width:46px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:#f3f3f3;font-size:13px}
.tb-btn:hover{background:#ffffff20}
.tb-btn.close:hover{background:#c42b1c}
.window-content{flex:1;min-height:0;overflow:auto;background:#202020}
.settings-layout,.explorer{display:flex;height:100%;min-height:0}
.settings-nav{width:215px;flex-shrink:0;padding:20px 10px;background:#252525;border-right:1px solid var(--line);overflow:auto}
.settings-nav-item,.explorer-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:4px;margin-bottom:3px;cursor:pointer;font-size:13px}
.settings-nav-item:hover,.explorer-item:hover{background:#ffffff0d}
.settings-nav-item.active{background:#ffffff12}
.settings-nav-item.active:before{content:"";width:3px;height:20px;border-radius:2px;background:var(--accent);margin-left:-8px;margin-right:5px}
.settings-nav-item svg,.explorer-item svg{width:18px;height:18px;flex-shrink:0}
.settings-panel{padding:28px 30px;flex:1;overflow:auto;min-width:0}
.settings-panel h2{font-size:25px;font-weight:600;margin-bottom:24px}
.setting-group{margin-bottom:24px}
.setting-group h3{font-size:13px;font-weight:600;margin-bottom:10px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;background:#2a2a2a;border:1px solid #ffffff0b;margin-bottom:7px;border-radius:5px}
.setting-row label{font-size:13px}
.setting-row small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.color-picker{width:42px;height:30px;border:1px solid #777;border-radius:3px;background:none;padding:0}
input[type=range]{width:130px;accent-color:var(--accent)}
.wallpaper-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.wallpaper-thumb{aspect-ratio:16/9;border-radius:4px;background-size:cover;background-position:center;border:2px solid transparent;cursor:pointer}
.wallpaper-thumb.active{border-color:var(--accent)}
.btn{padding:8px 14px;border:1px solid #ffffff2b;background:#ffffff12;border-radius:4px;cursor:pointer;font-size:12px}
.btn:hover{background:#ffffff21}
.btn.primary{background:#005fb8;border-color:#0078d4}
.btn.primary:hover{background:#1976c9}
.btn.danger{background:#a4262c}
input[type=text],input[type=url],input[type=password]{background:#292929;border:1px solid #777;border-radius:3px;padding:9px 11px;color:white;outline:0;font-size:13px;width:100%}
input:focus{border-color:#60cdff;outline:1px solid #60cdff}
.user-card{display:flex;align-items:center;gap:12px;padding:12px;background:#2a2a2a;border:1px solid #ffffff0b;border-radius:5px;margin-bottom:8px}
.uc-avatar{width:42px;height:42px;flex-shrink:0;border-radius:50%;background:#666;display:grid;place-items:center}
.uc-info{flex:1;min-width:0}.uc-name{font-size:13px}.uc-meta{font-size:11px;color:var(--muted);margin-top:4px}
.explorer-sidebar{width:180px;flex-shrink:0;padding:14px 8px;background:#252525;border-right:1px solid var(--line)}
.explorer-top{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line);font-size:12px}
.explorer-top input{flex:1}
.explorer-main{flex:1;min-width:0;overflow:auto;padding:14px}
.explorer-command{display:flex;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:4px;align-content:start}
.file-item{padding:14px 8px;text-align:center;border:1px solid transparent;border-radius:4px;cursor:pointer}
.file-item:hover{background:#ffffff0c;border-color:#ffffff14}
.file-item .fi-icon{height:40px;display:grid;place-items:center;margin-bottom:8px;color:#d5e8ff}
.file-item svg{width:31px;height:31px}.file-item span{font-size:12px;overflow-wrap:anywhere}
.notepad-area{width:100%;height:100%;resize:none;border:0;outline:0;background:#1e1e1e;color:#f5f5f5;padding:16px;font:13px/1.6 Consolas,monospace;user-select:text}
.terminal{height:100%;overflow:auto;background:#0c0c0c;color:#eee;padding:14px;font:13px/1.6 Consolas,monospace;user-select:text}
.terminal .prompt{color:#6ccb5f}.terminal input{width:65%;background:transparent;border:0;outline:0;color:#eee;font:inherit;padding:0}
#context-menu{position:absolute;z-index:20000;display:none;min-width:190px;padding:5px;background:#292929f5;backdrop-filter:blur(20px);border:1px solid #ffffff24;border-radius:5px;box-shadow:0 8px 30px #0006}
.ctx-item{padding:9px 12px;border-radius:3px;font-size:12px;cursor:pointer}.ctx-item:hover{background:#ffffff17}
.ctx-sep{height:1px;background:#ffffff20;margin:5px}
#toast{position:absolute;right:16px;bottom:calc(var(--taskbar-h) + 14px);z-index:30000;display:none;padding:12px 16px;background:#292929f5;border:1px solid #ffffff24;border-radius:5px;box-shadow:0 8px 30px #0005;font-size:12px}
body.light{--text:#1b1b1b;--muted:#555;--panel:rgba(245,245,245,.97)}
body.light .window-content,body.light .settings-nav,body.light .explorer-sidebar{background:#f3f3f3;color:#222}
body.light .titlebar{background:#f3f3f3}
body.light .titlebar .title,body.light .tb-btn{color:#222}
body.light .setting-row,body.light .user-card{background:#fff;border-color:#ddd}
body.light input[type=text],body.light input[type=url],body.light input[type=password],body.light .notepad-area{background:#fff;color:#222;border-color:#aaa}
body.light .terminal{background:#111;color:#eee}
@media(max-width:650px){
  :root{--taskbar-h:54px}
  #search-taskbar{width:38px;justify-content:center;padding:0}
  #search-taskbar span{display:none}
  #system-tray{right:4px}
  .tray-item{padding:0 3px;min-width:25px}
  #clock{min-width:57px}
  #start-menu{padding:18px 14px 0;bottom:calc(var(--taskbar-h) + 6px)}
  .start-apps{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:12px}
  .recommended-grid{grid-template-columns:1fr}
  .start-footer{margin:0 -14px;padding:10px 14px}
  .settings-nav{width:125px;padding:12px 5px}
  .settings-nav-item{gap:6px;padding:9px 6px;font-size:11px}
  .settings-nav-item svg{width:15px;height:15px}
  .settings-panel{padding:18px 12px}
  .settings-panel h2{font-size:20px}
  .explorer-sidebar{width:105px}
  .explorer-item{padding:9px 5px;font-size:11px;gap:5px}
  .explorer-item svg{width:14px;height:14px}
  .window{min-width:0;width:calc(100vw - 10px);left:5px!important;max-height:calc(100vh - var(--taskbar-h) - 5px)}
  .titlebar-btn{width:37px}
  .setting-row{padding:10px;gap:8px}
  .wallpaper-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<div id="boot-screen"><div class="win-logo" aria-label="Windows-style logo"><i></i><i></i><i></i><i></i></div><div class="spinner"></div></div>
<div id="login-screen">
  <div class="login-content">
    <div class="login-time" id="login-time">00:00</div><div class="login-date" id="login-date"></div>
    <div class="login-users" id="login-users"></div>
    <div class="login-password-box" id="login-password-box"><div id="login-selected-name"></div><input type="password" id="login-password" placeholder="Password" autocomplete="off"><div class="login-error" id="login-error">Incorrect password</div><button class="win-btn" onclick="attemptLogin()">Sign in</button><button class="win-btn" onclick="cancelPassword()">Back</button></div>
  </div>
  <div class="login-bottom"><button class="power-btn" title="Shut down" onclick="powerOff()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/></svg></button></div>
</div>
<div id="desktop-wrap">
  <div id="desktop"><div id="desktop-icons"></div></div>
  <div id="taskbar">
    <button class="taskbar-btn" id="start-btn" title="Start"><svg viewBox="0 0 24 24"><path fill="#60cdff" d="M2 3.5 10.7 2v9H2zM12 1.8 22 0v11H12zM2 13h8.7v9L2 20.5zM12 13h10v11l-10-1.8z"/></svg></button>
    <button id="search-taskbar" title="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><span>Search</span></button>
    <div id="taskbar-apps"></div>
    <div id="system-tray">
      <div class="tray-item" title="Network"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg></div>
      <div class="tray-item" title="Volume"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg></div>
      <div class="tray-item" id="clock"></div>
      <button class="tray-item" id="user-tray" title="Account" style="border:0;background:transparent"><span id="tray-avatar">U</span></button>
    </div>
  </div>
  <div id="start-menu">
    <div class="start-search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input class="start-search" id="start-search" placeholder="Search for apps, settings, and documents"></div>
    <div class="start-section-head"><span>Pinned</span><button class="small-action" id="all-apps-btn">All apps ›</button></div>
    <div class="start-apps" id="start-apps"></div>
    <div class="recommended"><div class="start-section-head"><span>Recommended</span><button class="small-action" onclick="showToast('You’re all caught up')">More ›</button></div><div class="recommended-grid" id="recommended-grid"></div></div>
    <div class="start-footer"><div class="user-avatar" id="start-avatar">U</div><span id="start-username">User</span><button onclick="lockScreen()" title="Lock"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button><button onclick="powerOff()" title="Power"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6a8 8 0 1 1-12 0"/><path d="M12 2v10"/></svg></button></div>
  </div>
  <div id="context-menu"></div><div id="toast"></div>
</div>
<script>
const ICONS={
 settings:`<svg viewBox="0 0 24 24" fill="none" stroke="#d7d7d7" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.7a8 8 0 0 1-1.6.9l-.3 1.8h-3l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.7-1.5-2.6 1.4-1.1a8 8 0 0 1 0-1.9l-1.4-1.1 1.5-2.6 1.7.7a8 8 0 0 1 1.6-.9l.3-1.8h3l.3 1.8a8 8 0 0 1 1.6.9l1.7-.7 1.5 2.6-1.4 1.1a8 8 0 0 1 0 1.8z"/></svg>`,

let state={windows:[],zIndex:100,accent:'#60a5fa',theme:'dark',wallpaper:wallpapers[0].value,blur:24,iconSize:38,transparency:.96,users:[{id:'u1',name:'Admin',password:'',avatar:null,isAdmin:true}],currentUserId:null,pendingUserId:null};
function loadData(){try{const raw=localStorage.getItem('customos_win11_v1');if(raw){const d=JSON.parse(raw);if(Array.isArray(d.users)&&d.users.length)state.users=d.users;if(d.settings)Object.assign(state,d.settings)}}catch(e){}}
function saveData(){try{localStorage.setItem('customos_win11_v1',JSON.stringify({users:state.users,settings:{accent:state.accent,theme:state.theme,wallpaper:state.wallpaper,blur:state.blur,iconSize:state.iconSize,transparency:state.transparency}}))}catch(e){showToast('Could not save settings in this browser')}}
function startBoot(){loadData();applyTheme();setTimeout(()=>{const b=document.getElementById('boot-screen');b.classList.add('hide');setTimeout(()=>{b.style.display='none';showLoginScreen()},450)},1300)}
function showLoginScreen(){const el=document.getElementById('login-screen');el.classList.add('visible');el.style.background=state.wallpaper.startsWith('linear')||state.wallpaper.startsWith('#')?state.wallpaper:`url("${state.wallpaper}") center/cover`;updateLoginClock();renderLoginUsers();document.getElementById('login-password-box').classList.remove('show');document.getElementById('login-users').style.display='flex'}
function updateLoginClock(){const n=new Date();document.getElementById('login-time').textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});document.getElementById('login-date').textContent=n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}
function renderLoginUsers(){const c=document.getElementById('login-users');c.innerHTML='';state.users.forEach(u=>{const e=document.createElement('div');e.className='login-user';e.tabIndex=0;e.innerHTML=`<div class="login-avatar">${u.avatar?`<img src="${u.avatar}" alt="">`:esc((u.name||'U')[0].toUpperCase())}</div><div class="login-name">${esc(u.name)}</div>`;e.onclick=()=>selectUser(u.id);e.onkeydown=ev=>{if(ev.key==='Enter')selectUser(u.id)};c.appendChild(e)})}
function selectUser(id){const u=state.users.find(x=>x.id===id);if(!u)return;state.pendingUserId=id;if(!u.password){doLogin(u);return}document.getElementById('login-users').style.display='none';document.getElementById('login-selected-name').textContent=u.name;document.getElementById('login-password').value='';document.getElementById('login-error').style.display='none';document.getElementById('login-password-box').classList.add('show');document.getElementById('login-password').focus()}
function cancelPassword(){document.getElementById('login-password-box').classList.remove('show');document.getElementById('login-users').style.display='flex';state.pendingUserId=null}
function attemptLogin(){const u=state.users.find(x=>x.id===state.pendingUserId);if(!u)return;if(document.getElementById('login-password').value===u.password)doLogin(u);else document.getElementById('login-error').style.display='block'}
document.getElementById('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')attemptLogin()});
function doLogin(u){state.currentUserId=u.id;state.pendingUserId=null;document.getElementById('login-screen').classList.remove('visible');document.getElementById('desktop-wrap').classList.add('visible');applyTheme();setDesktopBg(state.wallpaper);renderDesktopIcons();renderStartApps();renderRecommended();updateUserUI();updateClock();showToast(`Welcome, ${u.name}`)}
function lockScreen(){closeStartMenu();state.windows.forEach(w=>{const el=document.getElementById(w.id);if(el)el.remove()});state.windows=[];updateTaskbar();document.getElementById('desktop-wrap').classList.remove('visible');showLoginScreen()}
function signOut(){state.currentUserId=null;lockScreen()}
function updateUserUI(){const u=state.users.find(x=>x.id===state.currentUserId);if(!u)return;const i=(u.name||'U')[0].toUpperCase();document.getElementById('start-username').textContent=u.name;document.getElementById('start-avatar').textContent=i;document.getElementById('tray-avatar').textContent=i}
function applyTheme(){document.body.classList.toggle('light',state.theme==='light');const rgb=hexToRgb(state.accent);document.documentElement.style.setProperty('--accent',state.accent);document.documentElement.style.setProperty('--accent-rgb',rgb);document.documentElement.style.setProperty('--blur',state.blur+'px');document.documentElement.style.setProperty('--panel',state.theme==='light'?`rgba(245,245,245,${state.transparency})`:`rgba(32,32,32,${state.transparency})`)}
function setDesktopBg(v){const d=document.getElementById('desktop');if(d)d.style.background=v.startsWith('linear')||v.startsWith('#')?v:`url("${v}") center/cover`}
function hexToRgb(h){return `${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderDesktopIcons(){const c=document.getElementById('desktop-icons');c.innerHTML='';apps.forEach(a=>{const e=document.createElement('div');e.className='desk-icon';e.innerHTML=`<div class="icon-wrap">${ICONS[a.icon]}</div><span>${esc(a.name)}</span>`;let timer;e.addEventListener('click',()=>{document.querySelectorAll('.desk-icon').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');clearTimeout(timer);timer=setTimeout(()=>{e.dataset.clicked='1'},280)});e.addEventListener('dblclick',()=>openApp(a.id));e.addEventListener('touchend',()=>{if(e.dataset.touchOpen==='1'){openApp(a.id);e.dataset.touchOpen='0'}else{e.dataset.touchOpen='1';setTimeout(()=>e.dataset.touchOpen='0',600)}},{passive:true});c.appendChild(e)})}
function appButton(a){const e=document.createElement('button');e.className='start-app';e.innerHTML=`<div class="app-icon-wrap">${ICONS[a.icon]}</div><span>${esc(a.name)}</span>`;e.onclick=()=>{openApp(a.id);closeStartMenu()};return e}
function renderStartApps(filter=''){const c=document.getElementById('start-apps');c.innerHTML='';apps.filter(a=>a.name.toLowerCase().includes(filter.toLowerCase())).forEach(a=>c.appendChild(appButton(a)))}
function renderRecommended(){const c=document.getElementById('recommended-grid');c.innerHTML='';[apps[1],apps[0],apps[2],apps[3]].forEach(a=>{const e=document.createElement('div');e.className='recommended-item';e.innerHTML=`${ICONS[a.icon]}<div><b>${esc(a.name)}</b><small>Recently used</small></div>`;e.onclick=()=>{openApp(a.id);closeStartMenu()};c.appendChild(e)})}
function toggleStartMenu(){document.getElementById('start-menu').classList.toggle('open');if(document.getElementById('start-menu').classList.contains('open')){document.getElementById('start-search').value='';renderStartApps();document.getElementById('start-search').focus()}}
function closeStartMenu(){document.getElementById('start-menu').classList.remove('open')}
function openApp(id){const old=state.windows.find(w=>w.appId===id&&!w.closed);if(old){const el=document.getElementById(old.id);if(el){old.minimized=false;el.classList.remove('minimized');focusWindow(old.id)}return}const a=apps.find(x=>x.id===id);if(!a)return;const count=state.windows.filter(w=>!w.closed).length;const w={id:'win-'+Date.now(),appId:id,title:a.name,icon:a.icon,minimized:false,maximized:false,closed:false,x:Math.max(8,Math.min(80+count*25,innerWidth-330)),y:Math.max(8,Math.min(48+count*22,innerHeight-230)),w:Math.min(760,innerWidth-16),h:Math.min(520,innerHeight-80)};state.windows.push(w);const el=document.createElement('section');el.className='window';el.id=w.id;el.style.cssText=`left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px;z-index:${++state.zIndex}`;el.innerHTML=`<div class="titlebar"><span class="title">${ICONS[a.icon]}${esc(a.name)}</span><div class="titlebar-btns"><button class="tb-btn" data-action="min" aria-label="Minimize">−</button><button class="tb-btn" data-action="max" aria-label="Maximize">□</button><button class="tb-btn close" data-action="close" aria-label="Close">×</button></div></div><div class="window-content" id="content-${w.id}"></div>`;document.getElementById('desktop-wrap').appendChild(el);makeDraggable(el);el.querySelectorAll('.tb-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();({min:()=>minimizeWindow(w.id),max:()=>maximizeWindow(w.id),close:()=>closeWindow(w.id)})[b.dataset.action]()});el.addEventListener('pointerdown',()=>focusWindow(w.id));const c=document.getElementById('content-'+w.id);if(a.type==='settings')renderSettings(c);if(a.type==='explorer')renderExplorer(c);if(a.type==='notepad')renderNotepad(c);if(a.type==='terminal')renderTerminal(c);if(a.type==='about')renderAbout(c);updateTaskbar();focusWindow(w.id)}
function focusWindow(id){const e=document.getElementById(id);if(!e)return;e.style.zIndex=++state.zIndex;updateTaskbar(id)}
function minimizeWindow(id){const w=state.windows.find(x=>x.id===id);if(!w)return;w.minimized=true;document.getElementById(id).classList.add('minimized');updateTaskbar()}
function maximizeWindow(id){const w=state.windows.find(x=>x.id===id),e=document.getElementById(id);if(!w||!e)return;if(w.maximized){w.maximized=false;e.classList.remove('maximized');e.style.cssText+=`;left:${w.x}px;top:${w.y}px;width:${w.w}px;height:${w.h}px`}else{w.x=parseInt(e.style.left)||0;w.y=parseInt(e.style.top)||0;w.w=e.offsetWidth;w.h=e.offsetHeight;w.maximized=true;e.classList.add('maximized')} }
function closeWindow(id){const w=state.windows.find(x=>x.id===id);if(w)w.closed=true;const e=document.getElementById(id);if(e)e.remove();updateTaskbar()}
function updateTaskbar(activeId){const c=document.getElementById('taskbar-apps');c.innerHTML='';state.windows.filter(w=>!w.closed).forEach(w=>{const b=document.createElement('button');b.className='taskbar-btn'+(!w.minimized&&(!activeId||activeId===w.id)?' active':'');b.title=w.title;b.innerHTML=ICONS[w.icon];b.onclick=()=>{const e=document.getElementById(w.id);if(!e)return;if(w.minimized){w.minimized=false;e.classList.remove('minimized')}focusWindow(w.id)};c.appendChild(b)})}
function makeDraggable(el){const bar=el.querySelector('.titlebar');let dragging=false,ox=0,oy=0;bar.addEventListener('pointerdown',e=>{if(e.target.closest('.tb-btn'))return;const w=state.windows.find(x=>x.id===el.id);if(w?.maximized)return;dragging=true;ox=e.clientX-el.offsetLeft;oy=e.clientY-el.offsetTop;bar.setPointerCapture?.(e.pointerId);focusWindow(el.id)});bar.addEventListener('pointermove',e=>{if(!dragging)return;el.style.left=Math.max(0,Math.min(innerWidth-el.offsetWidth,e.clientX-ox))+'px';el.style.top=Math.max(0,Math.min(innerHeight- el.offsetHeight-54,e.clientY-oy))+'px'});bar.addEventListener('pointerup',()=>{dragging=false;const w=state.windows.find(x=>x.id===el.id);if(w){w.x=parseInt(el.style.left)||0;w.y=parseInt(el.style.top)||0}});bar.addEventListener('pointercancel',()=>dragging=false)}
function renderSettings(c){c.innerHTML=`<div class="settings-layout"><aside class="settings-nav"><div class="settings-nav-item active" data-panel="personalization">${ICONS.personalize} Personalization</div><div class="settings-nav-item" data-panel="accounts">${ICONS.users} Accounts</div><div class="settings-nav-item" data-panel="system">${ICONS.system} System</div><div class="settings-nav-item" data-panel="about">${ICONS.about} About</div></aside><div class="settings-panel" id="settings-content"></div></div>`;const nav=c.querySelectorAll('.settings-nav-item'),p=c.querySelector('#settings-content');function show(name){nav.forEach(x=>x.classList.toggle('active',x.dataset.panel===name));if(name==='personalization'){p.innerHTML=`<h2>Personalization</h2><div class="setting-group"><h3>Colors & appearance</h3><div class="setting-row"><div><label>Choose your mode</label><small>Change the appearance of windows and apps</small></div><div><button class="btn" id="dark">Dark</button> <button class="btn" id="light">Light</button></div></div><div class="setting-row"><div><label>Accent color</label><small>Use an accent color for highlights</small></div><input class="color-picker" type="color" id="accent" value="${state.accent}"></div></div><div class="setting-group"><h3>Background</h3><div class="wallpaper-grid" id="wallpapers"></div><div style="margin-top:12px;display:flex;gap:7px;flex-wrap:wrap"><input type="url" id="wp-url" placeholder="Image URL" style="flex:1;min-width:130px"><button class="btn primary" id="apply-url">Apply URL</button><label class="btn" style="cursor:pointer">Choose image<input type="file" id="wp-file" accept="image/*" hidden></label></div></div><div class="setting-group"><h3>Accessibility & effects</h3><div class="setting-row"><label>Transparency strength <small id="trans-val">${Math.round(state.transparency*100)}%</small></label><input type="range" min=".65" max="1" step=".01" id="trans" value="${state.transparency}"></div><div class="setting-row"><label>Blur strength <small id="blur-val">${state.blur}px</small></label><input type="range" min="0" max="40" id="blur" value="${state.blur}"></div></div>`;p.querySelector('#dark').onclick=()=>{state.theme='dark';applyTheme();saveData();show('personalization')};p.querySelector('#light').onclick=()=>{state.theme='light';applyTheme();saveData();show('personalization')};p.querySelector('#accent').oninput=e=>{state.accent=e.target.value;applyTheme();saveData()};p.querySelector('#trans').oninput=e=>{state.transparency=+e.target.value;p.querySelector('#trans-val').textContent=Math.round(state.transparency*100)+'%';applyTheme();saveData()};p.querySelector('#blur').oninput=e=>{state.blur=+e.target.value;p.querySelector('#blur-val').textContent=state.blur+'px';applyTheme();saveData()};const grid=p.querySelector('#wallpapers');wallpapers.forEach(wp=>{const d=document.createElement('div');d.className='wallpaper-thumb'+(state.wallpaper===wp.value?' active':'');d.style.background=wp.value;d.title=wp.name;d.onclick=()=>{state.wallpaper=wp.value;setDesktopBg(wp.value);saveData();show('personalization')};grid.appendChild(d)});p.querySelector('#apply-url').onclick=()=>{const u=p.querySelector('#wp-url').value.trim();if(u){state.wallpaper=u;setDesktopBg(u);saveData();showToast('Background updated')}};p.querySelector('#wp-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{state.wallpaper=ev.target.result;setDesktopBg(state.wallpaper);saveData();showToast('Background updated');show('personalization')};r.readAsDataURL(f)}}else if(name==='accounts'){renderAccountsPanel(p)}else if(name==='system'){p.innerHTML=`<h2>System</h2><div class="setting-group"><div class="setting-row"><div><label>Display</label><small>Browser viewport size</small></div><span>${innerWidth} × ${innerHeight}</span></div><div class="setting-row"><div><label>Operating system</label><small>Web-based desktop simulation</small></div><span>CustomOS</span></div><div class="setting-row"><div><label>Accounts</label><small>Local browser profiles</small></div><span>${state.users.length}</span></div></div><button class="btn" id="reset">Reset settings and users</button>`;p.querySelector('#reset').onclick=()=>{if(confirm('Reset all CustomOS settings and accounts?')){localStorage.removeItem('customos_win11_v1');location.reload()}}}else{p.innerHTML=`<h2>About</h2><div class="setting-row"><div><label>CustomOS</label><small>A Windows-inspired browser desktop</small></div><span>Web edition</span></div><p style="font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px">This is a visual simulation that runs in your browser. It is not Microsoft Windows and cannot run native Windows programs.</p>`}}nav.forEach(x=>x.onclick=()=>show(x.dataset.panel));show('personalization')}
function renderAccountsPanel(p){let h='<h2>Accounts</h2><div class="setting-group"><h3>Users on this device</h3>';state.users.forEach(u=>{h+=`<div class="user-card"><div class="uc-avatar">${esc((u.name||'U')[0].toUpperCase())}</div><div class="uc-info"><div class="uc-name">${esc(u.name)}${u.id===state.currentUserId?' (signed in)':''}</div><div class="uc-meta">${u.password?'Password protected':'No password'} · ${u.isAdmin?'Administrator':'Standard user'}</div></div><div style="display:flex;gap:4px;flex-wrap:wrap">${u.id!==state.currentUserId?`<button class="btn" data-switch="${u.id}">Switch</button>`:''}<button class="btn" data-edit="${u.id}">Rename</button>${state.users.length>1&&u.id!==state.currentUserId?`<button class="btn danger" data-del="${u.id}">Remove</button>`:''}</div></div>`});h+=`</div><div class="setting-group"><h3>Add an account</h3><div style="display:flex;flex-direction:column;gap:8px;max-width:340px"><input id="new-name" placeholder="Username"><input id="new-pass" type="password" placeholder="Password (optional)"><button class="btn primary" id="add-user">Add user</button></div></div><div class="setting-group"><h3>Change your password</h3><div style="display:flex;gap:8px;max-width:340px;flex-wrap:wrap"><input id="change-pass" type="password" placeholder="New password (empty = none)"><button class="btn" id="update-pass">Update</button></div></div>`;p.innerHTML=h;p.querySelector('#add-user').onclick=()=>{const n=p.querySelector('#new-name').value.trim(),pw=p.querySelector('#new-pass').value;if(!n)return showToast('Enter a username');if(state.users.some(u=>u.name.toLowerCase()===n.toLowerCase()))return showToast('That username already exists');state.users.push({id:'u'+Date.now(),name:n,password:pw,avatar:null,isAdmin:false});saveData();renderAccountsPanel(p);showToast('User added')};p.querySelector('#update-pass').onclick=()=>{const u=state.users.find(x=>x.id===state.currentUserId);if(u){u.password=p.querySelector('#change-pass').value;saveData();showToast('Password updated');renderAccountsPanel(p)}};p.querySelectorAll('[data-switch]').forEach(b=>b.onclick=()=>{const u=state.users.find(x=>x.id===b.dataset.switch);if(u){if(u.password){lockScreen();showToast('Choose the account on the sign-in screen')}else doLogin(u)}});p.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const u=state.users.find(x=>x.id===b.dataset.edit),n=prompt('New username:',u.name);if(n&&n.trim()){u.name=n.trim();saveData();updateUserUI();renderAccountsPanel(p);renderLoginUsers()}});p.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Remove this account?')){state.users=state.users.filter(u=>u.id!==b.dataset.del);saveData();renderAccountsPanel(p)}})}
function renderExplorer(c){c.innerHTML=`<div class="explorer"><aside class="explorer-sidebar"><div class="explorer-item">${ICONS.home} Home</div><div class="explorer-item">${ICONS.folder} Documents</div><div class="explorer-item">${ICONS.image} Pictures</div><div class="explorer-item">${ICONS.file} Downloads</div><div class="explorer-item">${ICONS.system} This PC</div></aside><div style="display:flex;flex-direction:column;flex:1;min-width:0"><div class="explorer-top"><button class="btn" id="back">←</button><button class="btn" id="forward">→</button><button class="btn" id="up">↑</button><input id="address" value="Home" aria-label="Address bar"></div><div class="explorer-main"><div class="explorer-command"><button class="btn" id="new-folder">＋ New</button><button class="btn" id="sort-files">Sort</button><button class="btn" id="view-files">View</button></div><div class="file-grid" id="file-grid"></div></div></div></div>`;const grid=c.querySelector('#file-grid');const files=[['Projects','folder'],['Documents','folder'],['Pictures','folder'],['Downloads','folder'],['readme.txt','file'],['photo.jpg','image']];function renderFiles(list=files){grid.innerHTML='';list.forEach(([name,icon])=>{const d=document.createElement('div');d.className='file-item';d.innerHTML=`<div class="fi-icon">${ICONS[icon]}</div><span>${esc(name)}</span>`;d.onclick=()=>{grid.querySelectorAll('.file-item').forEach(x=>x.style.background='');d.style.background='#ffffff18';c.querySelector('#address').value=name};grid.appendChild(d)})}renderFiles();c.querySelector('#new-folder').onclick=()=>{const n=prompt('Folder name:');if(n&&n.trim()){files.push([n.trim(),'folder']);renderFiles();showToast('Folder created in this demo')}};c.querySelector('#sort-files').onclick=()=>{files.sort((a,b)=>a[0].localeCompare(b[0]));renderFiles()};c.querySelector('#view-files').onclick=()=>grid.style.gridTemplateColumns=grid.style.gridTemplateColumns?'':'repeat(auto-fill,minmax(150px,1fr))';c.querySelector('#back').onclick=()=>c.querySelector('#address').value='Home';c.querySelector('#forward').onclick=()=>showToast('No forward location');c.querySelector('#up').onclick=()=>c.querySelector('#address').value='Home'}
function renderNotepad(c){c.innerHTML='<textarea class="notepad-area" placeholder="Start typing..." spellcheck="false"></textarea>'}
function renderTerminal(c){c.innerHTML='<div class="terminal" id="term-out"><div>CustomOS Terminal</div><div style="color:#aaa;margin-bottom:10px">Type help to see available commands.</div></div>';const out=c.querySelector('#term-out');function line(){const row=document.createElement('div');row.innerHTML='<span class="prompt">PS C:\\Users\\User&gt; </span><input aria-label="Terminal command">';out.appendChild(row);const input=row.querySelector('input');input.focus();input.onkeydown=e=>{if(e.key!=='Enter')return;const raw=input.value.trim(),cmd=raw.toLowerCase();input.disabled=true;let r='';if(cmd==='help')r='help   clear   date   echo <text>   whoami   users';else if(cmd==='clear'){out.innerHTML='';line();return}else if(cmd==='date')r=new Date().toString();else if(cmd.startsWith('echo '))r=raw.slice(5);else if(cmd==='whoami'){r=(state.users.find(u=>u.id===state.currentUserId)||{}).name||'unknown'}else if(cmd==='users')r=state.users.map(u=>u.name).join(', ');else if(cmd)r=`${raw} : The term was not recognized as a demo command.`;if(r){const d=document.createElement('div');d.style.whiteSpace='pre-wrap';d.textContent=r;out.appendChild(d)}line();out.scrollTop=out.scrollHeight}}line()}
function renderAbout(c){c.innerHTML=`<div style="padding:38px;text-align:center"><div style="margin:0 auto 18px;width:70px;height:70px;display:grid;place-items:center">${ICONS.system}</div><h2 style="font-size:24px;margin-bottom:10px">CustomOS</h2><p style="font-size:13px;color:var(--muted);margin-bottom:20px">Windows-inspired browser desktop</p><button class="btn primary" onclick="openApp('settings')">Open Settings</button></div>`}
function showContextMenu(x,y,items){const m=document.getElementById('context-menu');m.innerHTML='';items.forEach(i=>{if(i.sep){const d=document.createElement('div');d.className='ctx-sep';m.appendChild(d)}else{const d=document.createElement('div');d.className='ctx-item';d.textContent=i.label;d.onclick=()=>{i.action();hideContextMenu()};m.appendChild(d)}});m.style.display='block';m.style.left=Math.max(4,Math.min(x,innerWidth-205))+'px';m.style.top=Math.max(4,Math.min(y,innerHeight-190))+'px'}
function hideContextMenu(){document.getElementById('context-menu').style.display='none'}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.display='none',2300)}
function updateClock(){const n=new Date(),e=document.getElementById('clock');e.innerHTML=`${n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}<br>${n.toLocaleDateString([],{month:'numeric',day:'numeric',year:'numeric'})}`}
function powerOff(){document.getElementById('desktop-wrap').classList.remove('visible');document.getElementById('login-screen').classList.remove('visible');document.getElementById('boot-screen').style.display='flex';document.getElementById('boot-screen').classList.remove('hide');document.querySelector('#boot-screen .spinner').style.display='none';document.querySelector('#boot-screen').innerHTML='<div style="color:#f4f4f4;font-size:14px">It is now safe to close this tab.</div>'}
document.getElementById('start-btn').onclick=e=>{e.stopPropagation();toggleStartMenu()};
document.getElementById('search-taskbar').onclick=()=>{document.getElementById('start-menu').classList.add('open');document.getElementById('start-search').focus()};
document.getElementById('start-search').addEventListener('input',e=>renderStartApps(e.target.value));
document.getElementById('all-apps-btn').onclick=()=>{document.getElementById('start-search').value='';renderStartApps();document.getElementById('start-search').focus()};
document.addEventListener('click',e=>{if(!e.target.closest('#start-menu')&&!e.target.closest('#start-btn')&&!e.target.closest('#search-taskbar'))closeStartMenu();if(!e.target.closest('#context-menu'))hideContextMenu()});
document.getElementById('desktop').addEventListener('contextmenu',e=>{e.preventDefault();showContextMenu(e.clientX,e.clientY,[{label:'View',action:()=>showToast('Desktop icons shown')},{label:'Sort by name',action:()=>showToast('Desktop items sorted')},{label:'Refresh',action:()=>{renderDesktopIcons();showToast('Desktop refreshed')}},{sep:true},{label:'Personalize',action:()=>openApp('settings')},{label:'Lock',action:lockScreen}])});
document.getElementById('user-tray').onclick=()=>openApp('settings');
setInterval(updateClock,1000);setInterval(updateLoginClock,1000);startBoot();
</script>
</body>
